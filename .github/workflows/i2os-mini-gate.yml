name: I2OS Mini Gate CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  i2os-mini-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke test safe GO example
        run: |
          python i2os_gate.py --action examples/audit_go_safe_summary.json --json-only --no-reports

      - name: Smoke test Runtime Shield BLOCK example
        run: |
          python runtime_shield/shield.py examples/audit_block_prompt_injection.json policy/strict_policy.json || true
